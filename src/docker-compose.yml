services:
  api:
    build: .
    container_name: grid-risk-api
    ports:
      - "8000:8000"
    environment:
      # Optional: enable the LLM copilot (otherwise grounded local mode is used)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - BOB_API_KEY=${BOB_API_KEY:-}
      # Telegram live alerts. Values come from the host environment / .env —
      # never baked into the image.
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-false}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_DEFAULT_CHAT_ID=${TELEGRAM_DEFAULT_CHAT_ID:-}
      - TELEGRAM_NOTIFY_PRIORITIES=${TELEGRAM_NOTIFY_PRIORITIES:-CRITICAL,HIGH}
      - TELEGRAM_DEDUP_WINDOW_MINUTES=${TELEGRAM_DEDUP_WINDOW_MINUTES:-30}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-http://localhost:3000}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped

  ui:
    build: ./frontend-next
    container_name: grid-risk-ui
    ports:
      - "3000:3000"
    environment:
      # Server-side rewrite target, so the browser only ever talks to :3000.
      - API_PROXY_TARGET=http://api:8000
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    depends_on:
      - api
    restart: unless-stopped
