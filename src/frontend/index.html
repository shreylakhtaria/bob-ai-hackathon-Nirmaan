<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grid Risk Command Center</title>
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">⚡</div>
        <div>
          <div class="brand-title">GRID RISK</div>
          <div class="brand-sub">Command Center</div>
        </div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sim-badge" title="All data is synthetic simulation data">
        <span class="dot"></span> SIMULATION DATA
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <div>
          <div id="page-title" class="page-title">Operations Overview</div>
          <div id="page-sub" class="page-sub"></div>
        </div>
        <div class="topbar-right">
          <div id="grid-risk-pill" class="risk-pill">--</div>
          <div class="clock">
            <div class="clock-label">GRID TIME</div>
            <div id="clock" class="clock-val">--</div>
          </div>
          <button class="btn ghost" onclick="App.refresh()">↻ Refresh</button>
        </div>
      </header>
      <section id="view" class="view"><div class="loading">Loading…</div></section>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/pages.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
