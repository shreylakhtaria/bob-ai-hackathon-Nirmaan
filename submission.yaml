submission:
  title: "Grid Risk Command Center"    # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Power transformer and substation failures cause blackouts costing utilities
    $1M+/hour and affecting millions of people. Utilities still rely on calendar-based
    maintenance even though sensor data already shows failure signatures weeks in
    advance, because sensor telemetry, weather forecasts and crew availability are
    never combined in time for operators to act.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    An operator-facing decision-support platform that predicts equipment failure with
    a LightGBM model, explains each prediction with SHAP, ranks assets by an
    interpretable Grid Impact Score (not just raw probability), lets operators simulate
    "what happens if X fails" before it does, recommends crew pre-positioning, and
    answers natural-language operator questions through a grounded, tool-calling AI
    copilot that can never invent data.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Failure prediction via LightGBM (28 engineered features) + IsolationForest anomaly scoring, evaluated at ROC-AUC 0.979"
    - "Per-asset SHAP explainability surfaced as human-readable risk drivers (e.g. 'partial-discharge rise (72h): +65 pC')"
    - "Grid Impact Score — an interpretable 0-100 blend of failure probability, criticality, customers served, network exposure and weather risk that drives the maintenance queue"
    - "What-if simulation engine for asset failures and severe-weather events (customers affected, downstream assets, nearest crew, estimated outage)"
    - "Grounded, tool-calling AI copilot that answers operator questions using only real backend tool results and cites its evidence, with automatic upgrade to true LLM function-calling when an API key is configured"

  tech_stack:
    languages: ["Python", "JavaScript", "SQL"]                          # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["FastAPI", "Pydantic", "Uvicorn"]                      # e.g., ["FastAPI", "React"]
    ibm_technologies: []                                                # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["SQLite"]                                               # e.g., ["PostgreSQL", "Redis"]
    other: ["scikit-learn", "LightGBM", "SHAP", "pandas", "NumPy", "Leaflet", "Chart.js", "Tailwind CSS", "OpenAI SDK", "Nebius Token Factory", "Docker"]  # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    The Grid Impact Score: it is the difference between a model that ranks assets by
    raw failure probability and a system operators can actually trust to prioritize
    correctly. Our seeded demo hero (T-1024) ranks only ~#13 by raw probability but
    #1 on the maintenance queue once customer count, network exposure and weather risk
    are factored in — exactly the failure mode this project is meant to fix. We're also
    proud that the synthetic data isn't random noise: asset health is a latent variable
    that drives every sensor reading and failure label, which is what lets SHAP produce
    genuinely meaningful, non-fabricated explanations instead of noise attribution.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    All data is clearly-labelled SIMULATION DATA — there is no live SCADA/IoT feed
    integration yet. The AI copilot's optional LLM mode currently targets an
    OpenAI-SDK-compatible chat-completions API (Nebius Token Factory, OpenAI, or
    Azure OpenAI); it is NOT yet wired to IBM watsonx.ai / IBM Bob specifically, so
    the challenge's "Build a Bob solution" framing is not literally satisfied by a
    direct Bob integration today. The tool-calling loop is isolated behind a single
    client adapter and a fixed tool registry (see docs/solution-overview.md), so
    wiring it to watsonx.ai, or exposing the same tools to Bob over MCP, is a
    contained follow-up rather than a rewrite. The default data layer is SQLite for demo
    reliability — a documented, mechanical swap to PostgreSQL is described in
    docs/architecture.md but not exercised in this submission. The crew
    pre-positioning optimiser uses a greedy heuristic rather than a full
    OR-Tools LP solve.

